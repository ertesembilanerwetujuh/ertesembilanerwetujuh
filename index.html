<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <title>Jimpitan RT9</title>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/index.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#ffffff">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="apple-touch-icon" href="img/icon-192.png">
    <link rel="icon" href="img/icon-192.png">

</head>


<body>

<div id="toast"></div>

<main class="page landing-page">



<!-- ================= TOPBAR ================= -->

<header class="topbar">

    <!-- Logo -->

    <img
        class="brand-logo"
        src="img/logo_jimpitan.png"
        alt="Jimpitan RT9">

    <div class="topbar-right">

        <button
            id="btnInfo"
            class="icon-button"
            type="button"
            aria-label="Info">

            <img
                src="assets/icons/info.svg"
                alt="Info">

        </button>

        <button
            id="btnHelp"
            class="icon-button"
            type="button"
            aria-label="Bantuan">

            <img
                src="assets/icons/headset.svg"
                alt="Bantuan">

        </button>

    </div>

</header>



    <section class="landing-content">

        <!-- ================= LOGO ================= -->

        <img
            class="logo"
            src="img/index.jpg"
            alt="Jimpitan RT9">

        <!-- ================= TITLE ================= -->

        <h1 class="title">

            Jimpitan

        </h1>

        <!-- ================= DESCRIPTION ================= -->

        <p class="description">

            Audit jimpitan dan laporan keuangan

        </p>



        <!-- ================= ACTION ================= -->

        <section class="landing-action">

        <a
            href="#"
            class="btn-primary">

            Lanjutkan sebagai petugas

        </a>

        </section>




    </section>



<div class="landing-footer">
    <div>Jimpitan Digital RT 09 RW 07</div>
    <div>Versi 2.0 • © 2026</div>
</div>


</main>


<script type="module" src="js/index.js"></script>
<script src="js/register-sw.js"></script>

</body>

</html>
